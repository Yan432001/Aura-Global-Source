<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Aura Global E-Menu &amp; Management System</title>
    <meta name="description" content="Multi-store E-Menu, Telegram Mini App ordering system, and ERP admin management platform." />
    <meta property="og:title" content="Aura Global E-Menu &amp; Management System" />
    <meta property="og:description" content="Multi-store E-Menu, Telegram Mini App ordering system, and ERP admin management platform." />
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/preview iframe
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && event.message) || '';
        if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
